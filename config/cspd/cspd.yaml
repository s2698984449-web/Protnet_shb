# 通用训练配置。铸坯不进训练和验证；测试查询只用铸坯，支持集用其他来源。
# 类别文件夹：绝对路径下每个子目录是一类。

exp_name: STEEL_holdout_CAST_align

# 三个划分都必须是绝对路径。early_stop 时 val_dir 必填。
train_dir: D:/元强化学习/代码/data/steel_merged/train
val_dir: D:/元强化学习/代码/data/steel_merged/val
test_dir: D:/元强化学习/代码/data/steel_merged/test
exclude_classes: []

# 换源，并留出铸坯。训练和验证看不到 CAST。测试查询只用 CAST，支持集用其他来源。
# 铸坯只覆盖 crack、oxide、scratch，所以测试是 3-way。随机水平是 0.333，不要和 5-way 的 0.797 直接比。
cross_source: true
holdout_source: CAST
include_classes: [crack, crease, inclusion, oil, oxide, pit, punch, scratch]
# 已知工况按来源填写。数值是 0–1 码本，不是物理单位。
# material 1=钢。surface 1=热轧带钢，0.8=中厚板，0.55=铸坯，0.4=钢管，0.25=冷轧钢板，0=冷轧带钢。
# illuminance 是该来源抽样图像的灰度中位数。camera 0=灰度成像。
# light_mode 只填论文写明的光源。exposure 没有记录，保持缺测。
source_table:
  NEU:   {material: 1.0, surface: 1.0,  illuminance: 0.477, camera: 0.0}
  XSDD:  {material: 1.0, surface: 1.0,  illuminance: 0.508, camera: 0.0}
  GC10:  {material: 1.0, surface: 0.0,  illuminance: 0.328, light_mode: 1.0, camera: 0.0}
  CR7:   {material: 1.0, surface: 0.25, illuminance: 0.440, camera: 0.0}
  PLATE: {material: 1.0, surface: 0.8,  illuminance: 0.275, camera: 0.0}
  CAST:  {material: 1.0, surface: 0.55, illuminance: 0.398, camera: 0.0}
  PIPE:  {material: 1.0, surface: 0.4,  illuminance: 0.371, camera: 0.0}

# ---------- 工况槽位（通用） ----------
cond_slots: [material, surface, illuminance, light_mode, exposure, camera]
cond_dim: 6
condition_file:          # 可选。JSON：相对 split 根的路径 -> {槽位: 数值}
illumination_manifest:   # 可选。亮度脚本 CSV，用 offset 填 illuminance
cond_fallback_image_stats: false
illuminance_offset_scale: 80.0

# ---------- 位置标注（通用，可空） ----------
mask_root:
mask_root_train: D:/元强化学习/代码/data/steel_masks/train
mask_root_val: D:/元强化学习/代码/data/steel_masks/val
mask_root_test: D:/元强化学习/代码/data/steel_masks/test
mask_pattern: "{stem}.png"
use_mask_proto: true
gauss_sigma_ratio: 0.15
location_loss_weight: 0.5
# 同一类、不同来源的原型距离。权重小，避免把见过的类挤在一起。0 表示不加。
source_proto_weight: 0.05

# ---------- 还原图（扩散或亮度校正结果，可空） ----------
# 目录结构与 train/val/test 平行。空则还原支路等于原图，FiLM 仍调制该支路。
restored_root:

image_size: 224
n_way: 5
n_way_test: 3
k_shot: 3
q_query: 3
feat_dim: 128
film_rho: 0.5
policy_rho: 0.5
topk_ratio: 0.1
adapt_steps: 1
adapt_lr: 0.1
pretrained_backbone: true
freeze_backbone: true
backbone_lr: 0.0001
lr: 0.001
weight_decay: 0.0001
grad_clip: 1.0
iters: 200
eval_every: 5
eval_tasks: 20
early_stop: true
early_start: 100
patience: 10
monitor: loss
min_delta: 0.0
seed: 0
device: cuda

# 前面各块保持冻结。只解开 layer4，用更小的学习率，避免把 ImageNet 特征冲掉。
freeze:
  layer4: false
