# 2026-11-10 看图。level 没改，下面是建议。种子 0，每类最多 20 张，按框裁切。XSDD 无掩码，看的是整图。
look_2026_11_10:
  method: "seed 0；有框则 crop_margin 0.35 后拼图；占比是框并集 / 整图"
  missing: "CSU 辊印压缩包不在 data/，这一对没看"
  suggest_exact:
    - "GC10 punching × CR7 punching：两边都是圆孔。CR7 常是一列孔"
  suggest_keep_related:
    - "CR7 pits × GC10 rolled pit：CR7 是成列针尖点（占比 0.018，外接框高宽比 0.10），GC10 是更大的椭圆压痕（0.049，高宽比 2.05）"
    - "NEU scratches × XSDD scratch：NEU 是粗亮线（0.177），XSDD 是细暗线。只作子型"
    - "CSU scratches × 暗划痕：细暗竖线，不像 NEU 亮线"
    - "CAST scratch × NEU scratch：都是亮竖线，但铸坯背景很粗"
    - "GC10 oil × CR7 oil：GC10 是圆滴（0.028），CR7 多是靠边竖向污痕（0.124）"
    - "GC10 crease/waist × PIPE fold/wrinkle：GC10 是平滑板上的浅折，PIPE 是粗糙管上的厚棱。不升"
  suggest_downgrade:
    - "NEU inclusion × GC10 inclusion：文献 exact 先降回 related。NEU 是成片竖向暗痕（0.197），GC10 是很小的点（0.015）"
    - "PIPE scratch × 长划痕：PIPE 是短弯沟（0.010），不进 scratch 正样本"
    - "CSU oxide scale × oxide_scale：12 张里多是细线或过曝条，先不当氧化皮正样本"
    - "NEU patches × CR7 macular：不并。NEU 是高对比黑斑（0.303），CR7 是发虚竖斑（0.161）"
    - "CR7 dents × GC10 rolled pit：不并。dent 是成排小矩形压印（0.186），不是坑"
  suggest_keep_split:
    - "PLATE Bs 是块状黑斑（0.086，高宽比 1.40）。Ss 是弯钩，不是直条（0.170）。classes.txt 的 Ls 仍记为笔误"
    - "PLATE Foe 是圆坑（0.033），和 In 的竖条（0.063，高宽比 0.21）不是一类"
    - "XSDD red iron 是不规则污斑；iron ash 是局部坑和拖尾。都不并进氧化皮"
    - "XSDD 板系氧化皮是离散片，温度系是满场细点。NEU 轧入氧化皮（0.380）更接近温度系，而不是板系"
    - "XSDD 渣夹杂是发亮的撕裂金属，和其他夹杂不兼容"
    - "PIPE warp 的框很小（0.008），裁切里看到的是短弯裂纹，不是整管形变。仍不并进折类"
    - "CR7 linear 是细竖线（占比 0.040，高宽比 0.05），可作暗划痕子型候选，目录先保持 linear"
