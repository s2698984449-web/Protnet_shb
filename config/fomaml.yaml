# 折内一阶元初始化。四块参数都更新。初始化按支持集收益加权，权重上限小于 1。
output_dir: output/meta_transfer/theta0_fomaml
training:
  epochs: 3
  inner_steps: 1
  inner_lr: 0.01
  outer_lr: 0.001
  outer_momentum: 0.9
  log_every_steps: 10
  num_workers: 0
  early_stopping_patience: 1
  early_stopping_min_delta: 0.0
  # 正式训练写完 last.pt 后，用同一折监督权重做留出。运行名是「训练名-holdout」。
  holdout_after_train: true
  modules:
    - Backbone
    - Where
    - RoiFeature
    - Box
    - Class
  reuse_weight_cap: 0.5
  where_loss_weight: 1.0
  # 每个物理组取这么多视角做内/外更新和初始化打分。组覆盖仍按 5-shot，不丢掉物理组。
  views_per_group: 1
  # RoI 不够时最多放到每组这么多视角，禁止退回整组全部相机图。
  fallback_views_per_group: 3
  gradient_checkpointing: true
  loss:
    weights:
      roi: 0.25
      positive: 1.0
      ranking: 1.0
      hard_negative: 1.5
      localization: 0.75
    positive_iou: 0.5
    negative_iou: 0.5
    working_logit: 0.0
    ranking_margin: 0.2
    hard_negative_top_k: 32
pilot:
  epochs: 1
  dataset: mvtec
  episodes: 1
