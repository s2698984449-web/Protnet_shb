# Aviation meta-learning experiment registry (exp01–exp08)
# Usage:
#   python scripts/run_experiment.py --list
#   python scripts/run_experiment.py --exp exp08_protonet --stage train
#   python scripts/run_experiment.py --exp exp08_protonet --stage eval
#   python scripts/run_experiment.py --grid exp04_fastlr

defaults:
  python: auto
  track: aerospace
  data_dir_path: data
  yolo_weights: outputs/航天/weights/aviation_yolo26_pretrained.pt
  ways: 2
  shots: 5
  rgb_only: true
  train_domains: "0,1,2"
  test_domain: 3
  meta_batch_size: 2
  first_order: true
  w_rl_max: 0
  stage1_end: 1000
  stage2_end: 1000
  eval_tasks: 100
  eval_every: 50
  seed: 42
  freeze_backbone: false
  backbone_meta_lr: 1e-5
  head_meta_lr: 1e-3
  fast_lr: 0.02
  adapt_steps: 5
  iters: 300
  meta_algorithm: maml
  protonet_distance: euclidean

bases:
  maml_unfreeze_real3:
    meta_algorithm: maml
    freeze_backbone: false
    train_domains: "0,1,2"
    fast_lr: 0.02

  protonet_unfreeze_real3:
    meta_algorithm: protonet
    freeze_backbone: false
    train_domains: "0,1,2"
    protonet_distance: euclidean

  # 方案C: ProtoNet + 改进原型聚合
  protonet_proto_c:
    meta_algorithm: protonet
    freeze_backbone: false
    train_domains: "0,1,2"
    protonet_distance: euclidean
    protonet_prototype_type: trim_mean

  final_eval_common:
    script: eval.py
    seeds: "42,43,44"
    eval_tasks: 100
    rgb_only: true
    freeze_backbone: false

experiments:
  # --- P0 ablations ---
  exp01_p0_no_rl_full7:
    description: "P0-1 no RL, train domains 0-2 + AeBAD 4-7"
    stage: train
    extends: maml_unfreeze_real3
    exp_name: exp01_p0-1_no_rl_full7
    freeze_backbone: true
    train_domains: "0,1,2,4,5,6,7"
    iters: 500

  exp02_p0_no_rl_real3:
    description: "P0-2 no RL, real domains 0-2 only"
    stage: train
    extends: maml_unfreeze_real3
    exp_name: exp02_p0-2_no_rl_real3
    freeze_backbone: true
    iters: 500

  # --- exp04 MAML unfreeze baseline ---
  exp04_full:
    description: "P1-1 MAML unfreeze, fast_lr=0.02, 300 iter (main baseline 0.679)"
    stage: train
    extends: maml_unfreeze_real3
    exp_name: exp04_full_unfreeze_lr002

  exp04_eval:
    description: "3-seed final eval for exp04_full"
    stage: eval
    extends: final_eval_common
    checkpoint: ./checkpoints/exp04_full_unfreeze_lr002/best.pt
    out_json: ./reports/final_eval_exp04_full.json
    adapt_steps: 5
    fast_lr: 0.02

  exp04_eval_as_protonet:
    description: "ProtoNet inference on exp04 MAML weights (diagnostic)"
    stage: eval
    extends: final_eval_common
    checkpoint: ./checkpoints/exp04_full_unfreeze_lr002/best.pt
    out_json: ./reports/final_eval_exp04_as_protonet.json
    meta_algorithm: protonet

  # --- exp05 AeBAD expanded training ---
  exp05_full:
    description: "exp04 config + AeBAD domains 4-7"
    stage: train
    extends: maml_unfreeze_real3
    exp_name: exp05_unfreeze_full7_lr002
    train_domains: "0,1,2,4,5,6,7"

  # --- exp06 episode augmentation ---
  exp06_full:
    description: "exp04 + episode_aug on meta-train"
    stage: train
    extends: maml_unfreeze_real3
    exp_name: exp06_epaug_unfreeze_lr002
    episode_aug: true

  exp06_eval:
    description: "3-seed final eval for exp06"
    stage: eval
    extends: final_eval_common
    checkpoint: ./checkpoints/exp06_epaug_unfreeze_lr002/best.pt
    out_json: ./reports/final_eval_exp06_full.json
    adapt_steps: 5
    fast_lr: 0.02

  # --- exp07 cross-domain + early stop ---
  exp07_smoke:
    description: "exp07 smoke (20 iter)"
    stage: train
    extends: maml_unfreeze_real3
    exp_name: exp07_smoke_crossdom
    cross_domain_episodes: true
    eval_patience: 2
    early_stop_min_delta: 0.0
    eval_tasks: 20
    eval_every: 10
    iters: 20

  exp07_full:
    description: "Cross-domain episodes + early stopping (full 300 iter)"
    stage: train
    extends: maml_unfreeze_real3
    exp_name: exp07_crossdom_es_lr002
    cross_domain_episodes: true
    eval_patience: 3
    early_stop_min_delta: 0.001

  exp07_eval:
    description: "3-seed final eval for exp07"
    stage: eval
    extends: final_eval_common
    checkpoint: ./checkpoints/exp07_crossdom_es_lr002/best.pt
    out_json: ./reports/final_eval_exp07_crossdom_es_lr002.json
    adapt_steps: 5
    fast_lr: 0.02

  # --- exp08 ProtoNet (current mainline) ---
  exp08_protonet_smoke:
    description: "ProtoNet smoke (20 iter)"
    stage: train
    extends: protonet_unfreeze_real3
    exp_name: exp08_protonet_smoke
    eval_tasks: 20
    eval_every: 10
    iters: 20

  exp08_protonet:
    description: "ProtoNet unfreeze full — current mainline (0.852 domain_3)"
    stage: train
    extends: protonet_unfreeze_real3
    exp_name: exp08_protonet_unfreeze

  exp08_eval:
    description: "3-seed final eval for exp08 ProtoNet"
    stage: eval
    extends: final_eval_common
    checkpoint: ./checkpoints/exp08_protonet_unfreeze/best.pt
    out_json: ./reports/final_eval_exp08_protonet_unfreeze.json
    meta_algorithm: protonet

  exp08_eval_exclude22:
    description: "exp08 eval excluding QC-failed specimen 22 damage ROIs"
    stage: eval
    extends: final_eval_common
    checkpoint: ./checkpoints/exp08_protonet_unfreeze/best.pt
    out_json: ./reports/final_eval_exp08_exclude_specimen22_damage.json
    meta_algorithm: protonet
    exclude_sample_ids_from: data/aviation/domain_3/3_damage/exclude_qc_specimen22.txt

  exp08_eval_qc_deleted:
    description: "exp08 eval after specimen 22 damage folders removed from disk"
    stage: eval
    extends: final_eval_common
    checkpoint: ./checkpoints/exp08_protonet_unfreeze/best.pt
    out_json: ./reports/final_eval_exp08_qc_deleted.json
    meta_algorithm: protonet

  # --- exp09 ProtoNet on processed_greedy (方案 B 旁路) ---
  exp09_protonet_greedy:
    description: "ProtoNet on greedy K=3 partition + exclude 2023 (processed_greedy)"
    stage: train
    extends: protonet_unfreeze_real3
    exp_name: exp09_protonet_greedy
    data_dir_path: data/航天/processed_greedy
    checkpoint_path: outputs/航天/checkpoints

  exp09_eval:
    description: "3-seed final eval for exp09 greedy partition"
    stage: eval
    extends: final_eval_common
    checkpoint: outputs/航天/checkpoints/exp09_protonet_greedy/best.pt
    out_json: ./reports/final_eval_exp09_protonet_greedy.json
    meta_algorithm: protonet
    data_dir_path: data/航天/processed_greedy

  exp08_diagnose:
    description: "Hard-task diagnosis for exp08 ProtoNet"
    stage: diagnose
    script: scripts/diagnose_hard_tasks.py
    checkpoint: ./checkpoints/exp08_protonet_unfreeze/best.pt
    data_dir_path: data/航天/processed
    dataset_name: aviation
    seeds: "42,43,44"
    eval_tasks: 100
    hard_threshold: 0.7
    out_dir: ./reports/diagnose
    out_name: hard_tasks_exp08.json

  # --- exp10 ProtoNet + CBAM (P0 attention) ---
  exp10_protonet_cbam:
    description: "ProtoNet + CBAM on YOLO neck; same protocol as exp08 (processed/)"
    stage: train
    extends: protonet_unfreeze_real3
    exp_name: exp10_protonet_cbam
    rgb_cbam: true
    data_dir_path: data/航天/processed
    checkpoint_path: outputs/航天/checkpoints

  exp10_eval:
    description: "3-seed final eval for exp10 CBAM"
    stage: eval
    extends: final_eval_common
    checkpoint: outputs/航天/checkpoints/exp10_protonet_cbam/best.pt
    out_json: ./reports/final_eval_exp10_protonet_cbam.json
    meta_algorithm: protonet
    rgb_cbam: true
    data_dir_path: data/航天/processed

  # --- Phase-0 backbone pretraining (P0 SupCon-CE for aerospace/航天) ---
  exp11_p0_smoke:
    description: "P0 smoke — supcon_ce, track=航天, 2 epochs capped 5 steps"
    stage: pretrain
    script: pretrain_backbone.py
    track: 航天
    loss_mode: supcon_ce
    label_namespace: per_task
    temperature_adapt: false
    supcon_weight: 0.5
    ce_weight: 0.5
    proj_dim: 64
    supcon_temperature: 0.07
    batch_size: 8
    epochs: 2
    patience: 99
    max_steps_per_epoch: 5
    mix_strategy: combined
    backbone_train_mode: indices
    freeze_indices: "0,1,2,3,4,5"
    num_workers: 0
    out_weights: ./weights/smoke.pt
    out_checkpoint: ./checkpoints/smoke.pt

  exp11_p0_full:
    description: "P0 full — supcon_ce, track=航天, 25 epochs, indices freeze 0-5"
    stage: pretrain
    script: pretrain_backbone.py
    track: 航天
    loss_mode: supcon_ce
    label_namespace: per_task
    temperature_adapt: false
    supcon_weight: 0.5
    ce_weight: 0.5
    proj_dim: 64
    supcon_temperature: 0.07
    batch_size: 8
    epochs: 25
    patience: 5
    backbone_train_mode: indices
    freeze_indices: "0,1,2,3,4,5"
    mix_strategy: combined
    num_workers: 0
    out_weights: ./weights/aviation_yolo26_supcon_v5.pt
    out_checkpoint: ./checkpoints/pretrain_v5_best.pt

  # --- exp12 ProtoNet + trim_mean（方案C-①）---
  exp12_protonet_trim_mean:
    description: "exp12 ProtoNet + trim_mean pooling — removes outlier support samples before prototype"
    stage: train
    extends: protonet_proto_c
    exp_name: exp12_protonet_trim_mean
    protonet_distance: euclidean
    protonet_prototype_type: trim_mean

  exp12_eval:
    description: "3-seed final eval for exp12 trim_mean"
    stage: eval
    extends: final_eval_common
    checkpoint: outputs/航天/checkpoints/exp12_protonet_trim_mean/best.pt
    out_json: ./reports/final_eval_exp12_trim_mean.json
    meta_algorithm: protonet
    protonet_prototype_type: trim_mean

  # --- exp13 ProtoNet + mahalanobis（方案C-②）---
  exp13_protonet_mahalanobis:
    description: "exp13 ProtoNet + Mahalanobis distance — learns per-class variance (expected +1~2pt)"
    stage: train
    extends: protonet_proto_c
    exp_name: exp13_protonet_mahalanobis
    protonet_distance: mahalanobis
    protonet_prototype_type: mean

  exp13_eval:
    description: "3-seed final eval for exp13 mahalanobis"
    stage: eval
    extends: final_eval_common
    checkpoint: outputs/航天/checkpoints/exp13_protonet_mahalanobis/best.pt
    out_json: ./reports/final_eval_exp13_mahalanobis.json
    meta_algorithm: protonet
    protonet_distance: mahalanobis

  # --- exp14 ProtoNet + trim_mean + mahalanobis（方案C-①+②叠加）---
  exp14_protonet_trim_mahal:
    description: "exp14 ProtoNet + trim_mean + mahalanobis — both improvements combined (expected +2~3pt)"
    stage: train
    extends: protonet_proto_c
    exp_name: exp14_protonet_trim_mahal
    protonet_distance: mahalanobis
    protonet_prototype_type: trim_mean

  exp14_eval:
    description: "3-seed final eval for exp14 trim_mean + mahalanobis"
    stage: eval
    extends: final_eval_common
    checkpoint: outputs/航天/checkpoints/exp14_protonet_trim_mahal/best.pt
    out_json: ./reports/final_eval_exp14_trim_mahal.json
    meta_algorithm: protonet
    protonet_distance: mahalanobis
    protonet_prototype_type: trim_mean

  # --- exp15 ProtoNet + mean_shift（方案C-③）---
  exp15_protonet_meanshift:
    description: "exp15 ProtoNet + MeanShift clustering — multiple cluster centers per class (needs sklearn)"
    stage: train
    extends: protonet_proto_c
    exp_name: exp15_protonet_meanshift
    protonet_distance: euclidean
    protonet_prototype_type: mean_shift

  exp15_eval:
    description: "3-seed final eval for exp15 MeanShift"
    stage: eval
    extends: final_eval_common
    checkpoint: outputs/航天/checkpoints/exp15_protonet_meanshift/best.pt
    out_json: ./reports/final_eval_exp15_meanshift.json
    meta_algorithm: protonet
    protonet_prototype_type: mean_shift

  # ================================================================
  # Experiment 1: illumination augmentation (gamma + brightness + specular)
  # 基线：exp14 (trim_mean + mahalanobis, 98.4%)
  # 目标：验证光照差异是否是 specimen 20 误差的根因
  # ================================================================
  exp16_illumination_aug:
    description: "Exp16: ProtoNet + trim_mean + mahalanobis + illumination_aug (gamma+brightness+specular). Baseline: exp14=98.4%. Target: verify if illumination is the root cause of specimen-20 errors."
    stage: train
    extends: protonet_proto_c
    exp_name: exp16_protonet_illumination
    protonet_distance: mahalanobis
    protonet_prototype_type: trim_mean
    aug_illumination: true
    episode_aug: false
    # checkpoint 落盘到 航天/checkpoints/exp16_protonet_illumination/

  exp16_eval:
    description: "3-seed final eval for exp16 illumination_aug"
    stage: eval
    extends: final_eval_common
    checkpoint: outputs/航天/checkpoints/exp16_protonet_illumination/best.pt
    out_json: ./reports/final_eval_exp16_illumination.json
    meta_algorithm: protonet
    protonet_distance: mahalanobis
    protonet_prototype_type: trim_mean

  # ================================================================
  # Experiment 2: multi-scale input jitter (320 / 480 / 640)
  # 基线：exp14 (trim_mean + mahalanobis, 98.4%)
  # 目标：验证多尺度特征是否能提升整体 acc 上限
  # ================================================================
  exp17_multiscale:
    description: "Exp17: ProtoNet + trim_mean + mahalanobis + multi-scale input jitter (320/480/640). Baseline: exp14=98.4%. Target: push acc beyond 98.4% via scale-invariant representations."
    stage: train
    extends: protonet_proto_c
    exp_name: exp17_protonet_multiscale
    protonet_distance: mahalanobis
    protonet_prototype_type: trim_mean
    input_scales: "320,512,640"
    episode_aug: false
    # checkpoint 落盘到 航天/checkpoints/exp17_protonet_multiscale/

  exp17_eval:
    description: "3-seed final eval for exp17 multi-scale"
    stage: eval
    extends: final_eval_common
    checkpoint: outputs/航天/checkpoints/exp17_protonet_multiscale/best.pt
    out_json: ./reports/final_eval_exp17_multiscale.json
    meta_algorithm: protonet
    protonet_distance: mahalanobis
    protonet_prototype_type: trim_mean

  # ================================================================
  # Experiment 3: illumination + multi-scale combined
  # 基线：exp14 (trim_mean + mahalanobis, 98.4%)
  # 目标：光照 + 多尺度联合效果
  # ================================================================
  exp18_illum_multiscale:
    description: "Exp18: ProtoNet + trim_mean + mahalanobis + illumination_aug + multi-scale (320/480/640). Baseline: exp14=98.4%. Target: combined effect of both interventions."
    stage: train
    extends: protonet_proto_c
    exp_name: exp18_protonet_illum_ms
    protonet_distance: mahalanobis
    protonet_prototype_type: trim_mean
    aug_illumination: true
    input_scales: "320,512,640"
    episode_aug: false
    # checkpoint 落盘到 航天/checkpoints/exp18_protonet_illum_ms/

  exp18_eval:
    description: "3-seed final eval for exp18 illumination + multi-scale"
    stage: eval
    extends: final_eval_common
    checkpoint: outputs/航天/checkpoints/exp18_protonet_illum_ms/best.pt
    out_json: ./reports/final_eval_exp18_illum_ms.json
    meta_algorithm: protonet
    protonet_distance: mahalanobis
    protonet_prototype_type: trim_mean

  # ================================================================
  # Experiment 3 (zero-cost): TTA multi-scale on existing exp14 checkpoint
  # 不需要重训，直接在现有 best.pt 上跑多尺度 TTA 推理
  # ================================================================
  exp19_tta_multiscale:
    description: "Exp19: Zero-cost TTA eval on exp14 checkpoint (trim_mean+mahal). Multi-scale TTA (320/480/640) without retraining. Target: verify if TTA can harvest extra gains on top of 98.4%."
    stage: eval
    extends: final_eval_common
    checkpoint: outputs/航天/checkpoints/exp14_protonet_trim_mahal/best.pt
    out_json: ./reports/final_eval_exp19_tta.json
    meta_algorithm: protonet
    protonet_distance: mahalanobis
    protonet_prototype_type: trim_mean
    script: eval.py
    tta_scales: "320,512,640"

grids:
  exp04_fastlr:
    description: "exp04 fast_lr grid (50 iter each)"
    extends: maml_unfreeze_real3
    eval_every: 25
    iters: 50
    items:
      - exp_name: exp04a_unfreeze_lr001
        fast_lr: 0.01
      - exp_name: exp04b_unfreeze_lr002
        fast_lr: 0.02
      - exp_name: exp04c_unfreeze_lr003
        fast_lr: 0.03

  exp07_adapt:
    description: "exp07 adapt_steps grid (50 iter each)"
    extends: maml_unfreeze_real3
    cross_domain_episodes: true
    eval_patience: 99
    eval_every: 50
    iters: 50
    items:
      - exp_name: exp07a_crossdom_adapt3
        adapt_steps: 3
      - exp_name: exp07a_crossdom_adapt5
        adapt_steps: 5
      - exp_name: exp07a_crossdom_adapt7
        adapt_steps: 7

  p0_ablations:
    description: "P0-1 + P0-2 sequential ablations"
    items:
      - exp: exp01_p0_no_rl_full7
      - exp: exp02_p0_no_rl_real3
