# 检索式 FOMAML 的记忆与借用。内外循环轮数和学习率仍用 config/fomaml.yaml。
experience_groups: 3
tasks_per_family: 8
clusters_per_module: 8
fast_profile:
  tasks_per_family: 4
  clusters_per_module: 4
top_k_initial: 2
max_top_k: 4
top_mass_threshold: 0.8
temperature_after_zscore: 1.0
pca_dim: 64
train_projection: false
trim_ratios: [0.10, 0.20, 0.40, 1.00]
trim_sketch_dim: 8192
trim_splits: 3
trim_calibration_min_members: 8
min_members_for_ties: 5
# 条件化迁移 v5.3：v5.2 + Support/Query 一阶对齐特征与稠密标签（默认只日志）。
rho_max: 0.3
utility_prior_count: 8
# 正式留出：硬门控。禁止靠扫阈值主改进。
null_eval_threshold: 0.5
module_loo:
  enabled: true
  modules_per_step: 1
  # 训练探索：对本步 LOO 目标模块强制关闭，激活 Add-One 并重规划下游。
  force_close_prob: 0.25
  # 强度：同任务配对排序（0.1vs0.2 / 0.2vs0.3 / 0.1vs0.3）；正式注入仍用策略 ρ。
  rho_probes: [0.1, 0.2, 0.3]
  rho_pairwise: true
  # 相对死区比例；同 RNG 双评 ε 恒为 0，已改为相对阈值 + EMA。
  rho_deadzone_rel: 0.05
  # 卡片：保留单卡相对 Null；≥2 张时再做轻量配对排序。
  card_probe: true
  card_pairwise: true
  # 每步 ρ/卡二选一，显著缩短 outer 中的反事实适配。
  probe_alternate: true
  # Null 符号边际：U≤0 推过 +margin（拒借权重大），U>0 推过 −margin。
  null_sign_refuse_weight: 2.0
  null_sign_accept_weight: 1.0
  null_sign_margin: 0.5
  # 卡 Softmax 温度 <1 更锐；配对损失加权。
  card_temperature: 0.5
  card_pair_loss_weight: 2.0
# 一阶对齐：卡本是 −αg；Support 对齐≠Query 有用，只作特征/日志，不作硬规则。
first_order:
  enabled: true
  # 把 Support 对齐特征喂给 ψ（新输入列零初始化）；关掉则喂零。
  feed_policy: true
  # 稠密一阶标签的辅助监督；默认关，先跑日志闸门。
  supervise: false
  card_loss_weight: 0.1
  gate_loss_weight: 0.1
  listwise_tau: 0.1
  gate_deadzone: 0.0001
  # supervise=true 时乘到 null_sign_*_weight 上；0=关掉符号边际。
  null_sign_scale: 0.0
ap_utility:
  # 默认隔离：不进主决策损失；every_n=0 关闭训练步。符号一致率留给 Meta-Val/诊断。
  enabled: false
  every_n_steps: 0
  hidden: 64
policy_hidden: 128
policy_adam_lr: 0.001
feature_dim: 256
geometry_dim: 6
cluster_seed: 20261124
bank_seed: 20261124
signature_version: fpn-mean-roialign7-gap-v2-5module
near_duplicate_cosine: 0.90
# 密文 FP16 把超过这个比例的元素截成 0 时，改存 FP32。
fp16_zero_fraction_limit: 0.05
output_dir: output/meta_transfer/experience_bank
same_object_families:
  - [mvtec:toothbrush, realiad:toothbrush]
  - [mvtec:transistor, realiad:transistor1]
learnable_inner_lr: true
inner_lr_init: 0.01
inner_lr_min: 0.00001
inner_lr_max: 0.03
inner_lr_optimizer: Adam
inner_lr_meta_lr: 0.001
