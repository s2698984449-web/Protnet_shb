<text x="1590.0" y="60.0" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="15">数据与给定掩码</text>
<rect x="1729.0" y="46.0" width="22" height="16" rx="4" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
<text x="1759.0" y="60.0" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="15">冻结</text>
<rect x="1823.0" y="46.0" width="22" height="16" rx="4" fill="#ECFDF5" stroke="#047857" stroke-width="2"/>
<text x="1853.0" y="60.0" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="15">可训练 / 更新</text>
<rect x="1976.0" y="46.0" width="22" height="16" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="2" stroke-dasharray="7 5"/>
<text x="2006.0" y="60.0" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="15">验证反馈</text>
<text x="80" y="62" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="38" font-weight="700">训练与困难对反馈</text>
<text x="80" y="108" fill="#4B5563" font-family="Microsoft YaHei, sans-serif" font-size="20">验证只更新采样缓冲，不做优化梯度；测试来源隔离，不回流训练</text>
<text x="104.0" y="228.0" text-anchor="start" fill="#1D4ED8" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700">训练来源数据</text>
<text x="104.0" y="264.0" text-anchor="start" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400">只用训练来源</text>
<text x="104.0" y="291.0" text-anchor="start" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400">留出来源不进入训练或验证更新</text>
<text x="590.0" y="228.0" text-anchor="start" fill="#1D4ED8" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700">严格分组采样</text>
<text x="590.0" y="264.0" text-anchor="start" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400">support / query 必须来自不同 groups.json 组</text>
<text x="590.0" y="291.0" text-anchor="start" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400">组不足则放弃该次抽样，不按图拆分</text>
<text x="1076.0" y="228.0" text-anchor="start" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700">前向打分</text>
<text x="1076.0" y="264.0" text-anchor="start" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400">共享编码与双区域原型，路径见图 00</text>
<text x="1076.0" y="291.0" text-anchor="start" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400">查询标签不进入打分</text>
<text x="1562.0" y="228.0" text-anchor="start" fill="#047857" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700">查询交叉熵</text>
<text x="1562.0" y="264.0" text-anchor="start" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400">损失仅为 query 分类交叉熵</text>
<text x="1562.0" y="291.0" text-anchor="start" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400">查询标签只用于该损失</text>
<text x="2048.0" y="228.0" text-anchor="start" fill="#047857" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700">只更新投影</text>
<text x="2048.0" y="264.0" text-anchor="start" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400">反向传播只更新 proj3，骨干冻结</text>
<text x="2048.0" y="291.0" text-anchor="start" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400">策略网络本版关闭，不更新</text>
<text x="104.0" y="483.0" text-anchor="start" fill="#C2410C" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700">验证（无梯度）</text>
<text x="104.0" y="519.0" text-anchor="start" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400">在训练来源上做同源评估，统计同来源混淆</text>
<text x="104.0" y="546.0" text-anchor="start" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400">不做反向传播，不更新参数</text>
<text x="674.0" y="483.0" text-anchor="start" fill="#C2410C" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700">按来源保留 top 3</text>
<text x="674.0" y="519.0" text-anchor="start" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400">每个训练来源各自排序，只保留最高 3 对</text>
<text x="674.0" y="546.0" text-anchor="start" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400">不把留出混淆算进来</text>
<text x="1154.0" y="483.0" text-anchor="start" fill="#C2410C" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700">连续两次确认</text>
<text x="1154.0" y="519.0" text-anchor="start" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400">须连续两次都进入该来源 top 3 才入缓冲</text>
<text x="1154.0" y="546.0" text-anchor="start" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400">缺席即退出，避免一次抖动</text>
<text x="1664.0" y="483.0" text-anchor="start" fill="#C2410C" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700">困难对缓冲</text>
<text x="1664.0" y="519.0" text-anchor="start" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400">只改变后续训练 episode 的类别组成</text>
<text x="1664.0" y="546.0" text-anchor="start" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400">不改变损失；预热后渐增请求概率，有上限</text>
<text x="104.0" y="688.0" text-anchor="start" fill="#1D4ED8" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700">测试 / 留出来源</text>
<text x="104.0" y="724.0" text-anchor="start" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400">来源隔离，仅作评估</text>
<text x="104.0" y="751.0" text-anchor="start" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400">不更新缓冲，不回流训练，也不产生梯度</text>
<text x="880.0" y="730.0" text-anchor="start" fill="#4B5563" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="400">与上图反馈环断开：测试结果不进入缓冲，也不更新参数。</text>
<text x="80" y="879.0" fill="#4B5563" font-family="Microsoft YaHei, sans-serif" font-size="15">本版关闭策略网络与跨来源课程。困难对只作用于训练 episode 的类别组成。</text>
<text x="2620.0" y="887.0" text-anchor="end" fill="#6B7280" font-family="Microsoft YaHei, sans-serif" font-size="15">bot · cspd</text>
</svg>
