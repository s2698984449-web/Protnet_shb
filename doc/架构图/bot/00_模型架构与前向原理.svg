<rect x="1560.0" y="46.0" width="22" height="16" rx="4" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2"/>
<text x="1590.0" y="60.0" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="15">数据与给定掩码</text>
<rect x="1729.0" y="46.0" width="22" height="16" rx="4" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
<text x="1759.0" y="60.0" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="15">冻结</text>
<rect x="1823.0" y="46.0" width="22" height="16" rx="4" fill="#ECFDF5" stroke="#047857" stroke-width="2"/>
<text x="1853.0" y="60.0" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="15">可训练 / 更新</text>
<rect x="1976.0" y="46.0" width="22" height="16" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="2" stroke-dasharray="7 5"/>
<text x="2006.0" y="60.0" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="15">验证反馈</text>
<text x="80" y="62" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="38" font-weight="700">模型架构与前向原理</text>
<text x="80" y="108" fill="#4B5563" font-family="Microsoft YaHei, sans-serif" font-size="20">当前启用路径：共享冻结骨干至 layer3，只训练 1×1 投影；输出是分类，不是定位</text>
<text x="104.0" y="238.0" text-anchor="start" fill="#1D4ED8" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700">支持集输入</text>
<text x="104.0" y="274.0" text-anchor="start" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400">给定图像与缺陷掩码</text>
<text x="104.0" y="301.0" text-anchor="start" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400">掩码来自数据集，不是模型预测</text>
<text x="104.0" y="421.0" text-anchor="start" fill="#1D4ED8" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700">查询集输入</text>
<text x="104.0" y="457.0" text-anchor="start" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400">同样必须提供给定图像与掩码</text>
<text x="104.0" y="484.0" text-anchor="start" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400">查询标签不进入前向打分</text>
<text x="582.0" y="232.0" text-anchor="start" fill="#4B5563" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="700">共享编码（权值共用，支持 / 查询各自前向）</text>
<text x="614.0" y="288.0" text-anchor="start" fill="#6B7280" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700">冻结骨干</text>
<text x="614.0" y="324.0" text-anchor="start" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400">ImageNet 预训练 ResNet18，取 layer3</text>
<text x="614.0" y="351.0" text-anchor="start" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400">梯度不回传到骨干</text>
<text x="614.0" y="451.0" text-anchor="start" fill="#047857" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700">可训练投影 proj3</text>
<text x="614.0" y="487.0" text-anchor="start" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400">1×1 卷积，256 → 128，输出 14×14×128</text>
<text x="614.0" y="514.0" text-anchor="start" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400">本版唯一更新的模块</text>
<text x="1284.0" y="345.0" text-anchor="start" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700">core / ring 池化</text>
<text x="1284.0" y="381.0" text-anchor="start" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400">对 14×14 投影特征，用给定掩码划分</text>
<text x="1284.0" y="408.0" text-anchor="start" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400">core 为掩码内，ring 为输入分辨率膨胀环带</text>
<text x="1284.0" y="435.0" text-anchor="start" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400">空核或空环时用膨胀区顶替，详见 02</text>
<text x="1764.0" y="238.0" text-anchor="start" fill="#047857" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700">支持集原型</text>
<text x="1764.0" y="274.0" text-anchor="start" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400">同类 support 向量先平均，再 L2 归一化</text>
<text x="1764.0" y="301.0" text-anchor="start" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400">得到 p_core、p_ring</text>
<text x="1764.0" y="421.0" text-anchor="start" fill="#1D4ED8" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700">查询向量</text>
<text x="1764.0" y="457.0" text-anchor="start" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400">每个 query 单独 L2 归一化，不聚合</text>
<text x="1764.0" y="484.0" text-anchor="start" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400">得到 q_core、q_ring</text>
<text x="2264.0" y="278.0" text-anchor="start" fill="#047857" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700">分类打分</text>
<text x="2264.0" y="314.0" text-anchor="start" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400">logit = cos(q_core, p_core)</text>
<text x="2264.0" y="341.0" text-anchor="start" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400">        + β · cos(q_ring, p_ring)</text>
<text x="2264.0" y="368.0" text-anchor="start" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400">β = 0.25 固定；输出类别 logits，不是定位</text>
<text x="80" y="670.0" fill="#4B5563" font-family="Microsoft YaHei, sans-serif" font-size="15">本版关闭策略网络与跨来源课程，不在主路径展开。工况、β 策略与模块关系见 03–05。查询标签只在损失中使用，见 01。</text>
<text x="2620.0" y="678.0" text-anchor="end" fill="#6B7280" font-family="Microsoft YaHei, sans-serif" font-size="15">bot · cspd</text>
</svg>
