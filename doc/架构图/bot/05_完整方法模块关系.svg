<rect x="860.0" y="46.0" width="22" height="16" rx="4" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2"/>
<text x="890.0" y="60.0" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="15">数据与给定掩码</text>
<rect x="1029.0" y="46.0" width="22" height="16" rx="4" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
<text x="1059.0" y="60.0" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="15">冻结</text>
<rect x="1123.0" y="46.0" width="22" height="16" rx="4" fill="#ECFDF5" stroke="#047857" stroke-width="2"/>
<text x="1153.0" y="60.0" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="15">可训练 / 更新</text>
<rect x="1276.0" y="46.0" width="22" height="16" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="2" stroke-dasharray="7 5"/>
<text x="1306.0" y="60.0" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="15">验证反馈</text>
<rect x="1400.0" y="46.0" width="22" height="16" rx="4" fill="#F3F4F6" stroke="#6B7280" stroke-width="2" stroke-dasharray="7 5"/>
<text x="1430.0" y="60.0" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="15">未启用 / 预留</text>
<text x="80" y="62" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="38" font-weight="700">完整方法模块关系</text>
<text x="80" y="108" fill="#4B5563" font-family="Microsoft YaHei, sans-serif" font-size="20">实线为当前启用数据流；虚线为已实现但本版关闭、或只属于其他训练模式的路径</text>
<text x="80.0" y="175.0" text-anchor="start" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="700">① 数据与采样</text>
<text x="104.0" y="224.0" text-anchor="start" fill="#1D4ED8" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700">图像与缺陷掩码</text>
<text x="104.0" y="260.0" text-anchor="start" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400">support / query 都必须提供给定掩码</text>
<text x="104.0" y="287.0" text-anchor="start" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400">掩码来自数据集，不是模型预测</text>
<text x="760.0" y="224.0" text-anchor="start" fill="#6B7280" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700">工况槽位</text>
<text x="760.0" y="260.0" text-anchor="start" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400">values 与缺测 mask 随 episode 装入</text>
<text x="760.0" y="287.0" text-anchor="start" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400">本版检测器前向默认不消费，见 03</text>
<text x="1416.0" y="224.0" text-anchor="start" fill="#1D4ED8" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700">严格分组采样</text>
<text x="1416.0" y="260.0" text-anchor="start" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400">support 与 query 来自不同 groups.json 组</text>
<text x="1416.0" y="287.0" text-anchor="start" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400">同源 episode；ρ 跨来源本版关闭</text>
<text x="2072.0" y="224.0" text-anchor="start" fill="#C2410C" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700">困难对缓冲（验证反馈）</text>
<text x="2072.0" y="260.0" text-anchor="start" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400">同源混淆 → 来源 top 3 → 两次确认</text>
<text x="2072.0" y="287.0" text-anchor="start" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400">只改类别组成，不改损失，不回流测试</text>
<text x="102.0" y="409.0" text-anchor="start" fill="#4B5563" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="700">② 当前启用的双区域路径（curriculum / DualRegionBetaDetector）</text>
<text x="134.0" y="467.0" text-anchor="start" fill="#047857" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700">冻结骨干 + 可训练 proj3</text>
<text x="134.0" y="503.0" text-anchor="start" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400">冻结 ImageNet ResNet18 至 layer3</text>
<text x="134.0" y="530.0" text-anchor="start" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400">只训练 proj3：256→128，14×14</text>
<text x="760.0" y="467.0" text-anchor="start" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700">core / ring 与原型</text>
<text x="760.0" y="503.0" text-anchor="start" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400">给定掩码划分双区域，细节见 02</text>
<text x="760.0" y="530.0" text-anchor="start" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400">同类 support 先平均再 L2；query 不聚合</text>
<text x="1386.0" y="467.0" text-anchor="start" fill="#047857" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700">固定 β 打分（本版）</text>
<text x="1386.0" y="503.0" text-anchor="start" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400">logit = cos(core) + 0.25 · cos(ring)</text>
<text x="1386.0" y="530.0" text-anchor="start" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400">输出类别 logits，不是定位</text>
<text x="2012.0" y="467.0" text-anchor="start" fill="#047857" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700">查询交叉熵</text>
<text x="2012.0" y="503.0" text-anchor="start" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400">只用 query 分类损失</text>
<text x="2012.0" y="530.0" text-anchor="start" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400">反向传播只更新 proj3</text>
<text x="80.0" y="658.0" text-anchor="start" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="700">③ 可选 β 策略（已实现，本版关闭）与工况的真实接点</text>
<text x="104.0" y="716.0" text-anchor="start" fill="#6B7280" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700">support_stats</text>
<text x="104.0" y="752.0" text-anchor="start" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400">6 个特征统计 + support 工况均值与 mask 均值</text>
<text x="104.0" y="779.0" text-anchor="start" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400">不使用查询，也不调制特征图</text>
<text x="1004.0" y="716.0" text-anchor="start" fill="#6B7280" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700">EpisodeBetaPolicy</text>
<text x="1004.0" y="752.0" text-anchor="start" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400">MLP 输出整集一个 β ∈ [0, 0.5]</text>
<text x="1004.0" y="779.0" text-anchor="start" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400">use_policy=true 时才会替换固定 β，见 04</text>
<text x="1904.0" y="716.0" text-anchor="start" fill="#6B7280" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700">与打分的关系</text>
<text x="1904.0" y="752.0" text-anchor="start" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400">若开启，β 只加权 ring 余弦项</text>
<text x="1904.0" y="779.0" text-anchor="start" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400">本版不连这条虚线，打分用固定 0.25</text>
<text x="80.0" y="871.0" text-anchor="start" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="700">④ 其他训练模式（ConditionStrategyDetector，非本版 curriculum 前向）</text>
<text x="104.0" y="929.0" text-anchor="start" fill="#6B7280" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700">已实现但不接入本版检测器</text>
<text x="104.0" y="965.0" text-anchor="start" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400">工况经 apply_cond_mask → cond_encoder(MLP) → FiLM 调制 layer3/layer4 投影特征；γ、β 头零初始化，起步为恒等映射</text>
<text x="104.0" y="992.0" text-anchor="start" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400">PolicyNet 按类输出 g / alpha / gate / tau，用于混合原图与调制特征、两尺度加权和温度；与 EpisodeBetaPolicy 不是同一网络</text>
<text x="104.0" y="1019.0" text-anchor="start" fill="#111827" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400">零件编码 z_part 只来自支持集。本块与上图双区域路径并行存在于代码库，但不画进当前 B 的实线数据流，也不声称效果已验证。</text>
<text x="80" y="1147.0" fill="#4B5563" font-family="Microsoft YaHei, sans-serif" font-size="15">当前 B：layer3 + 固定 β + 同源采样 + 困难对组成反馈。策略网络、FiLM 工况调制与跨来源 ρ 均为已实现或可配置路径，本版关闭。不陈述实验精度。</text>
<text x="2620.0" y="1155.0" text-anchor="end" fill="#6B7280" font-family="Microsoft YaHei, sans-serif" font-size="15">bot · cspd</text>
</svg>
